name: Lobby CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: Operation
        type: choice
        default: validate
        options:
          - validate
          - audit
          - publish
          - statistics

permissions:
  contents: read

concurrency:
  group: >-
    lobby-${{ (github.ref == 'refs/heads/main' &&
    (github.event_name == 'push' || github.event_name == 'schedule' ||
    (github.event_name == 'workflow_dispatch' &&
    (inputs.operation == 'publish' || inputs.operation == 'statistics')))) && 'publication' ||
    format('{0}-{1}-{2}', github.event_name, github.event.pull_request.number || github.ref, inputs.operation || '') }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' ||
    (github.event_name == 'workflow_dispatch' &&
    (inputs.operation == 'validate' || inputs.operation == 'audit')) }}

jobs:
  plan:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      operation: ${{ steps.decision.outputs.operation }}
      update_statistics: ${{ steps.decision.outputs.update_statistics }}
      source_sha: ${{ steps.decision.outputs.source_sha }}
      publish: ${{ steps.decision.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select operation in Docker
        id: decision
        env:
          CI_OPERATION: ${{ inputs.operation }}
        run: |
          set -eu
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            --env GITHUB_EVENT_NAME --env GITHUB_REF --env GITHUB_SHA --env CI_OPERATION \
            --env CI_OUTPUT_PATH=.local/ci/plan-output \
            --env CI_SUMMARY_PATH=.local/ci/plan-summary \
            node:24.15.0-bookworm-slim@sha256:4e6b70dd6cbfc88c8157ba19aa3d9f9cce6ba4703576d55459e45efcbc9c5f5d node .config/scripts/ci-policy.ts plan
          cat .local/ci/plan-output >> "$GITHUB_OUTPUT"
          cat .local/ci/plan-summary >> "$GITHUB_STEP_SUMMARY"

  dependency-review:
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime,development

  statistics:
    timeout-minutes: 10
    needs: plan
    if: >-
      github.ref == 'refs/heads/main' && needs.plan.outputs.update_statistics == 'true' &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'statistics'))
    runs-on: ubuntu-latest
    environment: renovate
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.result.outputs.changed }}
      sha: ${{ steps.result.outputs.sha }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Prepare fast workspace
        uses: ./.github/actions/workspace # zizmor: ignore[self-repository]
        with:
          target: workspace-fast
          tag: lobby-workspace-fast
      - name: Collect and prepare statistics branch in Docker
        env:
          GITHUB_STATS_TOKEN: ${{ github.token }}
          CI_OUTPUT_PATH: .local/ci/statistics-output
          CI_SUMMARY_PATH: .local/ci/statistics-summary
        run: |
          set -eu
          docker run --rm --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            --env GITHUB_STATS_TOKEN --env GITHUB_REPOSITORY --env GITHUB_REF \
            --env CI_OUTPUT_PATH --env CI_SUMMARY_PATH \
            lobby-workspace-fast sh -eu -c 'just stats && node .config/scripts/publish-stats.ts'
      - name: Record statistics result
        id: result
        run: |
          set -eu
          cat .local/ci/statistics-output >> "$GITHUB_OUTPUT"
          cat .local/ci/statistics-summary >> "$GITHUB_STEP_SUMMARY"
      - name: Create or update statistics pull request
        if: steps.result.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          STATISTICS_BRANCH: automation/statistics
        run: |
          set -eu
          pull_request=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$STATISTICS_BRANCH" --state open --json url --jq '.[0].url // ""')
          if [ -z "$pull_request" ]; then
            pull_request=$(gh pr create --repo "$GITHUB_REPOSITORY" --head "$STATISTICS_BRANCH" --base main \
              --title 'chore(stats): refresh public statistics' \
              --body 'Automated refresh of validated public statistics. The scheduled workflow validates this commit before it can be merged.')
          fi
          echo "pull_request=$pull_request" >> "$GITHUB_OUTPUT"
          echo "Statistics pull request: $pull_request" >> "$GITHUB_STEP_SUMMARY"

  build:
    timeout-minutes: 15
    needs: [plan, statistics]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
      needs.plan.outputs.operation != 'audit' &&
      ((needs.plan.outputs.update_statistics == 'false' && needs.statistics.result == 'skipped') ||
      (needs.plan.outputs.update_statistics == 'true' && needs.statistics.result == 'success' &&
      needs.statistics.outputs.changed == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.statistics.outputs.sha || needs.plan.outputs.source_sha }}
          persist-credentials: false
      - name: Record actual source SHA
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore validated federation indices
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/federation
          key: federation-v1-${{ hashFiles('.config/federation.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            federation-v1-${{ hashFiles('.config/federation.yaml') }}-
      - name: Prepare fast workspace
        uses: ./.github/actions/workspace # zizmor: ignore[self-repository]
        with:
          target: workspace-fast
          tag: lobby-workspace-fast
      - name: Validate and build in Docker
        env:
          LOBBY_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -eu
          docker run --rm --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            --env GITHUB_REPOSITORY --env GITHUB_SERVER_URL --env GITHUB_SHA \
            --env GITHUB_RUN_ID --env GITHUB_RUN_NUMBER --env LOBBY_SOURCE_SHA lobby-workspace-fast just ci
      - name: Upload native SARIF reports
        if: >-
          always() && hashFiles('.local/reports/sarif/**/*.sarif') != '' &&
          needs.plan.outputs.operation != 'statistics' &&
          (github.ref == 'refs/heads/main' ||
          (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository))
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: .local/reports/sarif
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-reports
          path: |
            .local/reports
            .cache/lighthouseci
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .local/build/site
      - name: Save validated federation indices from trusted main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/federation
          key: federation-v1-${{ hashFiles('.config/federation.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}

  sbom:
    timeout-minutes: 10
    needs: [plan, build]
    if: >-
      always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      needs.plan.outputs.operation != 'statistics' &&
      needs.plan.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout built source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          persist-credentials: false
      - name: Prepare fast workspace
        uses: ./.github/actions/workspace # zizmor: ignore[self-repository]
        with:
          target: workspace-fast
          tag: lobby-workspace-fast
      - name: Submit CycloneDX snapshots in Docker
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LOBBY_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          set -eu
          docker run --rm --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            --env GITHUB_TOKEN --env GITHUB_REPOSITORY --env GITHUB_REF \
            --env GITHUB_RUN_ID --env LOBBY_SOURCE_SHA \
            lobby-workspace-fast sh -eu -c 'just dependencies && node .config/scripts/submit-dependency-sboms.ts'
      - name: Upload CycloneDX and snapshot reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-snapshots
          path: .local/reports/sbom
          if-no-files-found: ignore
          include-hidden-files: true

  audit:
    timeout-minutes: 60
    needs: plan
    if: github.event_name == 'workflow_dispatch' && needs.plan.outputs.operation == 'audit'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [core, browser, lighthouse]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - name: Prepare audit workspace
        uses: ./.github/actions/workspace # zizmor: ignore[self-repository]
        with:
          target: workspace-audit
          tag: lobby-workspace-audit
      - name: Restore validated federation indices
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/federation
          key: federation-audit-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            federation-v1-${{ hashFiles('.config/federation.yaml') }}-
      - name: Run ${{ matrix.stage }} audit in Docker
        run: |
          set -eu
          docker run --rm --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            --env GITHUB_REPOSITORY --env GITHUB_SERVER_URL --env GITHUB_SHA \
            --env GITHUB_RUN_ID --env GITHUB_RUN_NUMBER \
            --env AUDIT_STAGE='${{ matrix.stage }}' lobby-workspace-audit \
            sh -c 'git config --global --add safe.directory /workspace && just check-audit-stage'
      - name: Upload native SARIF reports
        if: >-
          always() && matrix.stage == 'core' &&
          hashFiles('.local/reports/sarif/**/*.sarif') != '' &&
          (github.ref == 'refs/heads/main' ||
          (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository))
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: .local/reports/sarif
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-quality-reports-${{ matrix.stage }}
          path: |
            .local/reports
            .cache/lighthouseci
          include-hidden-files: true
          if-no-files-found: ignore

  codeql:
    timeout-minutes: 25
    needs: plan
    if: github.event_name == 'workflow_dispatch' && needs.plan.outputs.operation == 'audit'
    runs-on: ubuntu-24.04
    container:
      image: node:24.15.0-bookworm@sha256:f22d6a1f082c02f292e86929b5b0442ac2e5eaf438a5dea9b1566601c3e05940
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - name: Trust the mounted checkout for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          tools: linked
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            paths:
              - website/src
              - .config/scripts
              - .config/eslint-rules
            paths-ignore:
              - '**/node_modules/**'
              - website/.svelte-kit/**
              - .local/**
              - .cache/**
      - name: Analyze JavaScript and TypeScript
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript
          output: .local/reports/codeql
      - name: Upload CodeQL report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-reports
          path: .local/reports/codeql
          if-no-files-found: ignore

  deploy:
    timeout-minutes: 10
    needs: [plan, build]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.build.result == 'success' &&
      needs.plan.outputs.publish == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout built source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          persist-credentials: false
      - name: Verify source is still current main in Docker
        id: freshness
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          set -eu
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            --env GITHUB_TOKEN --env GITHUB_REPOSITORY --env CI_SOURCE_SHA \
            --env CI_OUTPUT_PATH=.local/ci/deployment-output \
            --env CI_SUMMARY_PATH=.local/ci/deployment-summary \
            node:24.15.0-bookworm-slim@sha256:4e6b70dd6cbfc88c8157ba19aa3d9f9cce6ba4703576d55459e45efcbc9c5f5d node .config/scripts/ci-policy.ts deployment
          cat .local/ci/deployment-output >> "$GITHUB_OUTPUT"
          cat .local/ci/deployment-summary >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy GitHub Pages
        id: deployment
        if: steps.freshness.outputs.current == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  gate:
    name: gate
    timeout-minutes: 2
    if: always() && !cancelled()
    needs:
      [plan, dependency-review, statistics, build, sbom, audit, codeql, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLAN_RESULT: ${{ needs.plan.result }}
          OPERATION: ${{ needs.plan.outputs.operation }}
          UPDATE_STATISTICS: ${{ needs.plan.outputs.update_statistics }}
          PUBLISH: ${{ needs.plan.outputs.publish }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          STATISTICS_RESULT: ${{ needs.statistics.result }}
          STATISTICS_CHANGED: ${{ needs.statistics.outputs.changed }}
          BUILD_RESULT: ${{ needs.build.result }}
          SBOM_RESULT: ${{ needs.sbom.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          set -eu
          test "$PLAN_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$DEPENDENCY_REVIEW_RESULT" = success
          else
            test "$DEPENDENCY_REVIEW_RESULT" = skipped
          fi
          if [ "$OPERATION" = audit ]; then
            test "$STATISTICS_RESULT" = skipped
            test "$BUILD_RESULT" = skipped
            test "$SBOM_RESULT" = skipped
            test "$AUDIT_RESULT" = success
            test "$CODEQL_RESULT" = success
            test "$DEPLOY_RESULT" = skipped
            exit 0
          fi
          test "$AUDIT_RESULT" = skipped
          test "$CODEQL_RESULT" = skipped
          if [ "$UPDATE_STATISTICS" = true ]; then
            test "$STATISTICS_RESULT" = success
            if [ "$STATISTICS_CHANGED" = true ]; then
              test "$BUILD_RESULT" = success
              test "$SBOM_RESULT" = skipped
              test "$DEPLOY_RESULT" = skipped
              exit 0
            fi
            test "$STATISTICS_CHANGED" = false
            test "$BUILD_RESULT" = skipped
            test "$SBOM_RESULT" = skipped
            test "$DEPLOY_RESULT" = skipped
            exit 0
          fi
          test "$STATISTICS_RESULT" = skipped
          test "$BUILD_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$SBOM_RESULT" = skipped
          else
            test "$SBOM_RESULT" = success
          fi
          if [ "$PUBLISH" = true ]; then
            test "$DEPLOY_RESULT" = success
          else
            test "$DEPLOY_RESULT" = skipped
          fi
