name: Renovate

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Renovate operation
        type: choice
        default: dry-run
        options:
          - dry-run
          - run

permissions:
  contents: read

concurrency:
  group: renovate-lobby
  cancel-in-progress: false

jobs:
  renovate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check GitHub App configuration
        env:
          APP_CLIENT_ID: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
        run: |
          set -eu
          if [ -z "$APP_CLIENT_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo '::error::Configure RENOVATE_APP_CLIENT_ID and RENOVATE_APP_PRIVATE_KEY and install the GitHub App on guesant/lobby before enabling Renovate.'
            exit 1
          fi
      - name: Create repository-scoped App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: guesant
          repositories: lobby
          permission-administration: read
          permission-checks: read
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
          permission-vulnerability-alerts: read
          permission-workflows: write
      - name: Select Renovate operation
        env:
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ "$MODE" = 'dry-run' ]; then
            echo 'RENOVATE_DRY_RUN=full' >> "$GITHUB_ENV"
          fi
      - name: Run Renovate
        uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-image: ghcr.io/renovatebot/renovate:44.201.1-full@sha256:eb95a37c0350651d7cc0dc5b383450cbbfeb0fc2ecba69cb13bd4839def31e1d
          mount-docker-socket: false
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: guesant/lobby
          RENOVATE_USERNAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_ALLOW_SCRIPTS: 'false'
