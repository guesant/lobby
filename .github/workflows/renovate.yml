name: Renovate

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Renovate operation
        type: choice
        default: dry-run
        options:
          - dry-run
          - run

permissions:
  contents: read

concurrency:
  group: renovate-lobby
  cancel-in-progress: false

jobs:
  renovate:
    if: github.ref == 'refs/heads/main'
    environment: renovate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Renovate operation
        env:
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ "$MODE" = 'dry-run' ]; then
            echo 'RENOVATE_DRY_RUN=full' >> "$GITHUB_ENV"
          fi
      - name: Run Renovate
        uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          renovate-image: ghcr.io/renovatebot/renovate:44.201.1-full@sha256:eb95a37c0350651d7cc0dc5b383450cbbfeb0fc2ecba69cb13bd4839def31e1d
          mount-docker-socket: false
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: guesant/lobby
          RENOVATE_USERNAME: guesant
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_ALLOW_SCRIPTS: 'false'
