<!doctype html>
<html
  lang="__LANG__"
  data-interface="__INTERFACE__"
  data-page="__PAGE__"
  data-link-view="compact"
  data-theme="system"
  data-motion="on"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <script>
      document.documentElement.dataset.jsEnabled = 'true';
      try {
        const options = __PREFERENCE_OPTIONS__;
        for (const key of Object.keys(options)) {
          const value = localStorage.getItem('guesant-links-' + key);
          if (value && options[key].includes(value)) {
            let attribute = key;
            if (key === 'view') {
              attribute = 'linkView';
            }
            document.documentElement.dataset[attribute] = value;
          }
        }
      } catch {}
    </script>
    __EARLY_HEAD__ %sveltekit.head%
  </head>
  <body class="__BODY_CLASS__">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
