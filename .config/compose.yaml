name: guesant-links

services:
  workspace:
    build:
      context: ..
      dockerfile: .config/container/Dockerfile
      target: workspace-fast
    working_dir: /workspace
    volumes:
      - ..:/workspace
      - ../../blog/public:/sources/blog:ro
      - ../../resume/site:/sources/resume:ro
      - node-modules:/workspace/website/node_modules
      - tooling-modules:/workspace/.config/node_modules
      - audit-modules:/workspace/.config/audit/node_modules
    ports:
      - '127.0.0.1:4173:4173'
    environment:
      PNPM_STORE_DIR: /pnpm/store
      GITHUB_STATS_TOKEN: ${GITHUB_STATS_TOKEN:-}
      LOBBY_BLOG_FEED: ${LOBBY_BLOG_FEED:-}
      LOBBY_RESUME_FEED: ${LOBBY_RESUME_FEED:-}
    init: true
  audit:
    extends: workspace
    build:
      context: ..
      dockerfile: .config/container/Dockerfile
      target: workspace-audit
    ports: []

volumes:
  node-modules:
  tooling-modules:
  audit-modules:
