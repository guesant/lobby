id: no-narrative-comments-jsonc
language: TypeScript
severity: error
message: Narrative comments are not allowed; use tool directives only.
files:
  - '**/*.jsonc'
rule:
  all:
    - kind: comment
    - not:
        regex: '^(//\s*|/\*+\s*)(prettier-ignore|IMPORTANT:|SPDX-License-Identifier:|Copyright)(\b|\s|\*/|$)'
